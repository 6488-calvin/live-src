name: daily-live-update

on:
  schedule:
    # 北京时间每天 04:00 自动执行（UTC 20:00）
    - cron: "0 20 * * *"
  workflow_dispatch: {}   # 也可以在 Actions 页面手动点"Run workflow"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install playwright beautifulsoup4

      - name: 安装浏览器内核
        run: |
          python -m playwright install --with-deps chromium

      - name: 抓取直播源并生成 txt
        run: |
          python simulate_fetch.py 5

      - name: 生成 m3u8 播放列表
        run: |
          python txt2m3u.py live.txt live.m3u8

      - name: 提交更新回 GitHub
        run: |
          git config user.name "live-update-bot"
          git config user.email "live-update-bot@users.noreply.github.com"
          git add live.txt live.m3u8
          git commit -m "daily update $(date -u +%F)" || echo "今日无变化"
          git push

      - name: 同步到 Gitee（国内访问）
                env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          python gitee_push.py live.txt live.m3u8

